name: deploy-book

on:
  push:
    branches:
      - main
      - "2025"

  workflow_dispatch:

# Prevent concurrent deploys to gh-pages
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

jobs:
  deploy-book:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up Python and uv
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      # Install OpenGL + virtual display support. This is needed to visualize
      # glfw, vispy, or napari-based notebooks without errors.
      - name: Set up OpenGL and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libglu1-mesa mesa-utils
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      # ✅ Verify OpenGL is working
      - name: Check OpenGL status
        run: |
          export DISPLAY=:99
          glxinfo | grep "OpenGL version"

      # Cache uv dependencies to avoid re-downloading on every push
      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      # Cache Jupyter execution outputs to skip re-running unchanged notebooks
      - name: Cache Jupyter execution cache
        uses: actions/cache@v4
        with:
          path: .jupyter_cache
          key: jupyter-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: jupyter-cache-${{ runner.os }}-

      # Install Python dependencies with uv
      - name: Install dependencies
        run: uv sync

      # Build the book
      - name: Build the book
        run: |
          chmod +x ./build.sh
          uv run ./build.sh
          touch ./_build/.nojekyll

      # Preserve the /2025/ subfolder (published from the 2025 branch) so the
      # clean root deploy below does not delete it. We pull the existing 2025/
      # tree off gh-pages and drop it into the publish dir.
      - name: Restore /2025/ subfolder from gh-pages
        if: github.ref == 'refs/heads/main'
        run: |
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then
            git archive FETCH_HEAD -- 2025 2>/dev/null | tar -x -C ./_build/html \
              && echo "Restored /2025/ subfolder into the publish dir" \
              || echo "No /2025/ subfolder found on gh-pages (nothing to preserve)"
          else
            echo "gh-pages branch does not exist yet; nothing to preserve"
          fi

      # Deploy main branch to root.
      # keep_files: false replaces the published tree with the fresh build, so
      # stale files (e.g. from renamed/renumbered chapters) are removed instead
      # of piling up. The /2025/ subfolder is preserved by the step above.
      - name: Deploy main to root
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_build/html
          keep_files: false
          destination_dir: .

      # Deploy 2025 branch to /2025/ subfolder.
      # keep_files: true is required here so publishing 2025 does NOT wipe the
      # root site. (The 2025 content is frozen, so it rarely redeploys.)
      - name: Deploy 2025 to subfolder
        if: github.ref == 'refs/heads/2025'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_build/html
          keep_files: true
          destination_dir: 2025
